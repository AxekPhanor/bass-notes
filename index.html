    <title>Bass Notes</title>

    <style>
      :root { color-scheme: light dark; --bg: #f6f3ee; --text: #1f1b16; --muted: #6b6259; --accent: #e8590c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15130f; --text: #f1ece4; --muted: #a69d92; --accent: #ff7a2f; } }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }
      img { width: 96px; height: 96px; }
      p { color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
